[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_CACHE = "/tmp/npm-cache"
NPM_CONFIG_UPDATE_NOTIFIER = "false"

[phases.install]
# Avoid `npm ci` wiping locked dirs on Railway volume/cache mounts
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
